name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: set up jdk 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      # Without signing secrets an unsigned release APK would not install, so ship debug-signed test builds.
      - name: decode keystore
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets absent; publishing debug-signed test builds."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "variant=release" >> "$GITHUB_OUTPUT"

      - name: unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --configuration-cache

      - name: assemble
        env:
          VARIANT: ${{ steps.sign.outputs.variant }}
        run: |
          task="assemble${VARIANT^}"
          ./gradlew "$task" --no-daemon --configuration-cache

      - name: upload apks to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VARIANT: ${{ steps.sign.outputs.variant }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          for apk in app/build/outputs/apk/"$VARIANT"/*.apk; do
            abi=$(basename "$apk" .apk | sed -E "s/^app-//; s/-$VARIANT(-unsigned)?$//")
            cp "$apk" "dist/Ping-$version-$abi-$VARIANT.apk"
          done
          # Notes come from this version's CHANGELOG section.
          awk -v h="## [$version]" 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ "$VARIANT" = "debug" ]; then
            { echo "Test build: debug-signed APKs (app id com.ping.app.debug). Uninstall an earlier debug build first if Android refuses the update."; echo; cat notes.md; } > notes.tmp && mv notes.tmp notes.md
            pre="--prerelease"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Ping $TAG" --notes-file notes.md ${pre:-}
          gh release upload "$TAG" dist/*.apk --clobber
