name: build

on:
  push:
    branches: [master, fresh, "feature/**", "gesture-*"]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: set up jdk 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --configuration-cache

      - name: compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon --configuration-cache

      - name: lint
        run: ./gradlew lintDebug --no-daemon --configuration-cache

      - name: assemble debug
        run: ./gradlew assembleDebug --no-daemon --configuration-cache

      - name: assemble release
        run: ./gradlew assembleRelease --no-daemon --configuration-cache

      - name: upload debug apks
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ping-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
